displayName: "Frontend app.caleo.id root"
monitoredResource:
  type: uptime_url
  labels:
    host: app.caleo.id
    project_id: gen-lang-client-0410251117
httpCheck:
  path: /
  port: 443
  useSsl: true
  validateSsl: true
  requestMethod: GET
period: 60s
timeout: 10s
checkerType: STATIC_IP_CHECKERS

