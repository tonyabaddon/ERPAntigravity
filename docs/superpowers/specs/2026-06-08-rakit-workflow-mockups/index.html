<script>
// ========================================================
//                   SAMPLE DATA / STATE
// ========================================================

      itemSearchTerm: '',

    modal: null, // 'lock' | 'review' | 'cancel' | 'reject'
    modalTxId: null,
    // Modal-specific working state
    lockDraft: null,    // copy of tx being locked

let state = newInitialState();

// ========================================================
//                  UTILITY FUNCTIONS
// ========================================================
function fmtRp(n) {
  if (n == null || isNaN(n)) return 'Rp 0';
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}
function uid() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }
function nextInvoiceNo() {
  const today = new Date();
  const d = today.toISOString().slice(0,10).replace(/-/g,'');
  return `INV-WIB-${d}-${uid().slice(0,4)}`;
}

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

// ========================================================
//                       TOAST
// ========================================================
function toast(msg, kind='success') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = msg;
  $('#toast-container').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = 0;
    el.style.transform = 'translateX(50%)';
    setTimeout(() => el.remove(), 320);
  }, 3200);
}

// ========================================================
//                    DEMO GUIDE
// ========================================================
const DEMO_STEPS = {
  1: { text: 'Halo! Coba buat transaksi rakit baru — klik <strong class="text-amber-300">+ Tambah Jasa Rakit</strong> di section kiri.', total: 4 },
  2: { text: 'Bagus. Isi form rakit (sudah ada default values), klik <strong class="text-amber-300">+ Tambah ke Cart</strong> → line muncul di keranjang.', total: 4 },
  3: { text: 'Cart sudah ada rakit. Sekarang klik <strong class="text-amber-300">💾 Simpan & Cetak Invoice DP</strong> di kanan. Transaksi akan masuk ke WIP list.', total: 4 },
  4: { text: 'Buka tab <strong class="text-amber-300">⏳ WIP List</strong> di top nav. Klik transaksi yang baru kamu buat → klik <strong class="text-amber-300">🔒 Selesaikan Rakit</strong>.', total: 4 },
  5: { text: 'Lock modal terbuka. Komponen bisa di-tambah/edit, harga final bisa di-adjust. Saat siap, klik <strong class="text-amber-300">📤 Submit untuk Approval Owner</strong>.', total: 4 },
  6: { text: 'Sekarang switch role ke Owner via tombol <strong class="text-amber-300">🔁 Switch ke Owner</strong> di kanan atas. Lalu buka tab <strong class="text-amber-300">✅ Approval</strong>.', total: 4 },
  7: { text: 'Sebagai Owner, kamu lihat list pending. Klik salah satu → review modal → klik <strong class="text-amber-300">✅ Approve</strong>. Stock decrement otomatis, status berubah.', total: 4 },
  8: { text: '🎉 Done — full lifecycle: WIP → PENDING_LOCK_APPROVAL → AWAITING_LUNAS. Coba juga tombol <strong class="text-amber-300">❌ Cancel</strong> di WIP atau <strong class="text-amber-300">Reject</strong> di Approval untuk explore flows lain.', total: 4 },
};
function updateDemoGuide() {
  const step = DEMO_STEPS[state.demoStep];
  if (!step) { $('#demo-guide').classList.add('hidden'); return; }
  $('#demo-guide').classList.remove('hidden');
  const stepLabel = state.demoStep >= 8 ? 'SELESAI 🎉' : `STEP ${Math.min(state.demoStep, 4)} OF 4`;
  $('#demo-guide').innerHTML = `
    <div class="step">DEMO ${stepLabel}</div>
    <div class="mt-1 leading-snug">${step.text}</div>
    ${state.demoStep > 1 ? '<button onclick="closeDemoGuide()" class="mt-2 text-[10px] text-cyan-300 hover:text-white underline">tutup panduan</button>' : ''}
  `;
}
function closeDemoGuide() { $('#demo-guide').classList.add('hidden'); }
function advanceDemo(targetStep) { if (state.demoStep < targetStep) { state.demoStep = targetStep; updateDemoGuide(); } }

// ========================================================
//                  NAV / VIEW SWITCHER
// ========================================================
function setView(view) {
  state.currentView = view;
  $$('.view').forEach(v => v.classList.add('hidden'));
  $(`#view-${view}`).classList.remove('hidden');
  $$('.nav-tab').forEach(t => t.classList.remove('active'));
  $(`.nav-tab[data-view="${view}"]`)?.classList.add('active');
  render();
}

// ========================================================
//                       COUNTS
// ========================================================
function updateCounts() {
  const wipCount = state.transactions.filter(t => t.status === 'WIP').length;
  const approvalCount = state.transactions.filter(t => t.status === 'PENDING_LOCK_APPROVAL').length;
  $('#wip-count-badge').textContent = wipCount;
  $('#approval-count-badge').textContent = approvalCount;
}

// ========================================================
//                  ROLE TOGGLE
// ========================================================
$('#role-toggle').addEventListener('click', () => {
  state.isOwner = !state.isOwner;
  $('#current-user-label').textContent = state.isOwner ? 'Owner Pak Tony' : 'Admin Toko';
  $('#role-toggle').textContent = state.isOwner ? '🔁 Switch ke Admin' : '🔁 Switch ke Owner';
  toast(`Login sekarang sebagai <strong>${state.isOwner ? 'Owner' : 'Admin'}</strong>`, 'info');
  render();
});

$('#reset-demo').addEventListener('click', () => {
  state = newInitialState();
  setView('cart');
  toast('Demo direset ke initial state.', 'info');
  updateDemoGuide();
});

$$('.nav-tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));

// ========================================================
//          RENDER: CART VIEW (PenjualanBaruScreen)
// ========================================================
function renderCart() {
  const d = state.draft;
  const subtotalKomp = d.cartItems.reduce((s,i) => s + (i.qty * i.unitPrice), 0);
  const subtotalRakit = d.rakitLines.reduce((s,r) => s + r.estimatedPrice, 0);
  const subtotal = subtotalKomp + subtotalRakit;
  const total = subtotal + (d.ongkirOn ? d.ongkirAmount : 0);
  const hasRakit = d.rakitLines.length > 0;
  const isCustomerLocked = d.selectedCustomerId != null;
  // Effective DP: convert percent → nominal
  const effectiveDp = d.paymentType === 'DP'
    ? (d.dpInputType === 'PERCENT' ? Math.round(total * d.dpAmount / 100) : d.dpAmount)
    : 0;
  const sisa = Math.max(0, total - effectiveDp);
  // Customer search filter
  const searchLow = (d.customerSearchTerm || '').toLowerCase();
  const matches = searchLow
    ? CUSTOMERS.filter(c => c.name.toLowerCase().includes(searchLow) || c.phone.includes(searchLow))
    : [];

  $('#view-cart').innerHTML = `
    <div class="card overflow-hidden">
      <div class="header-bar flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="opacity-70">‹</span>
          <div>
            <div class="font-extrabold text-sm">📋 Catat Penjualan Baru</div>
            <div class="text-[11px] opacity-65">Dashboard › Penjualan › Baru</div>
          </div>
        </div>
        <div class="flex gap-2 text-[11px]">
          <span class="bg-white/15 px-3 py-1 rounded-full font-bold">📅 8 Jun 2026</span>
          <span class="bg-white/15 px-3 py-1 rounded-full font-bold">👤 ${state.isOwner ? 'Owner' : 'Admin Toko'}</span>
        </div>
      </div>

      <div class="bg-white p-5 md:p-6 space-y-4">

        <!-- Channel selector -->
        <div class="seg">
          <button class="${d.channel==='walkin'?'active':''}" onclick="setChannel('walkin')">🏬 Walk-in</button>
          <button class="${d.channel==='tokopedia'?'active':''}" onclick="setChannel('tokopedia')">🛍 Tokopedia</button>
          <button class="${d.channel==='grosir'?'active':''}" onclick="setChannel('grosir')">🏭 Grosir</button>
          <button class="${d.channel==='whatsapp'?'active':''}" onclick="setChannel('whatsapp')">💬 WhatsApp</button>
        </div>

        ${d.channel === 'tokopedia' ? `
          <div class="bg-orange-50 border border-orange-200 rounded-xl px-3 py-2.5 mt-2 fade-in">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="font-extrabold text-orange-700 text-[12px] flex items-center gap-1">🛍 Detail Pesanan Tokopedia</span>
              <span class="pill chip-warning" style="font-size:9px">wajib</span>
            </div>
            <input class="field" placeholder="No. Pesanan Tokopedia (mis. INV/20260608/MPL/0123456789)" value="${d.tokpedOrderNo}" oninput="state.draft.tokpedOrderNo=this.value" />
          </div>
        ` : ''}

        ${d.channel === 'whatsapp' ? `
          <div class="bg-green-50 border border-green-200 rounded-xl px-3 py-2.5 mt-2 fade-in">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="font-extrabold text-green-700 text-[12px] flex items-center gap-1">💬 Detail WhatsApp</span>
              <span class="pill chip-info" style="font-size:9px">opsional · untuk follow-up</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input class="field" placeholder="No. HP customer" value="${d.waPhone}" oninput="state.draft.waPhone=this.value" />
              <input class="field" placeholder="Chat URL (opsional)" value="${d.waChatUrl}" oninput="state.draft.waChatUrl=this.value" />
            </div>
          </div>
        ` : ''}

        <div class="grid grid-cols-1 lg:grid-cols-[1.7fr_1fr] gap-4">

          <!-- LEFT PANEL -->
          <div class="space-y-3">

            <!-- Item Search -->
            <div class="panel-card">
              <div class="flex items-center justify-between mb-2">
                <div class="label-up">Cari Komponen</div>
                <span class="text-[11px] text-slate-400">SKU / nama barang</span>
              </div>
              <input class="field mb-3" placeholder="🔎 Cari SKU / nama..." value="${d.itemSearchTerm}" oninput="state.draft.itemSearchTerm=this.value;render()" />
              <div class="space-y-1.5 max-h-56 overflow-y-auto">
                ${(() => {
                  const term = d.itemSearchTerm.toLowerCase();
                  const filtered = term
                    ? CATALOG.filter(i => i.sku.toLowerCase().includes(term) || i.name.toLowerCase().includes(term))
                    : CATALOG.slice(0, 4);
                  if (filtered.length === 0) {
                    return `<div class="text-center text-slate-400 text-[12px] py-3">Tidak ada barang cocok dengan "${d.itemSearchTerm}"</div>`;
                  }
                  return filtered.map(item => `
                    <div class="flex items-center justify-between p-2 rounded-lg hover:bg-slate-50 cursor-pointer" onclick="addKompToCart('${item.sku}')">
                      <div class="flex-1">
                        <div class="font-extrabold text-[13px]">${item.name}</div>
                        <div class="text-[11px] text-slate-400">
                          <span class="text-blue-700 font-bold">Atas: ${item.stockAtas}</span> ·
                          <span class="text-amber-700 font-bold">Bawah: ${item.stockBawah}</span> ·
                          ${fmtRp(item.price)}
                        </div>
                      </div>
                      <button class="btn-ghost text-[11px] py-1 px-2">+ Tambah</button>
                    </div>
                  `).join('');
                })()}
              </div>
              ${!d.itemSearchTerm ? `<div class="text-[10px] text-slate-400 mt-2 text-center">Nampilkan 4 item teratas · ketik untuk filter</div>` : ''}
            </div>

            <!-- Jasa Rakit / Custom Panel Buttons (B addition) -->
            <div class="panel-card amber">
              <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                  <span class="text-base">🛠</span>
                  <div>
                    <div class="font-extrabold text-[13px] text-orange-700">Tambah Jasa</div>
                    <div class="text-[11px] text-orange-700/70">Pilih tipe jasa · invoice WIP sampai lock + approval</div>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2 mb-2">
                <button class="${d.rakitFormOpen && d.rakitFormDraft.type==='jasa_rakit' ? 'opacity-60':''} btn-amber py-2.5 px-3 text-[12px]" onclick="openRakitForm('jasa_rakit')">
                  ⚡ + Tambah Jasa Rakit
                </button>
                <button class="${d.rakitFormOpen && d.rakitFormDraft.type==='jasa_custom_panel' ? 'opacity-60':''} btn-amber py-2.5 px-3 text-[12px]" onclick="openRakitForm('jasa_custom_panel')" style="background:#0ea5e9;">
                  📦 + Tambah Jasa Custom Panel
                </button>
              </div>

              ${d.rakitFormOpen ? `
              <div class="bg-white border ${d.rakitFormDraft.type==='jasa_rakit'?'border-orange-300':'border-sky-300'} rounded-xl p-3 space-y-3 fade-in">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="pill ${d.rakitFormDraft.type==='jasa_rakit'?'chip-rakit':'chip-info'}">
                      ${d.rakitFormDraft.type==='jasa_rakit'?'⚡ Jasa Rakit':'📦 Jasa Custom Panel'}
                    </span>
                    <span class="text-[11px] text-slate-500">isi detail di bawah</span>
                  </div>
                  <button class="text-slate-400 hover:text-rose-500 text-base" onclick="cancelRakitForm()">✕</button>
                </div>
                <div>
                  <div class="key-up mb-1.5">Deskripsi (singkat, tampil di invoice)</div>
                  <input class="field" placeholder="${d.rakitFormDraft.type==='jasa_rakit'?'Mis. Box Wiring untuk PT XYZ — 1 unit':'Mis. Custom Panel Distribusi 3-fase — PLN 50kVA'}" value="${d.rakitFormDraft.description}" oninput="setRakitFormField('description', this.value)" />
                </div>
                <div>
                  <div class="key-up mb-1.5">Estimasi Harga (quote disepakati)</div>
                  <input class="field" type="number" placeholder="0" value="${d.rakitFormDraft.estimatedPrice || ''}" oninput="setRakitFormField('estimatedPrice', Number(this.value || 0))" />
                  <div class="text-[11px] text-slate-500 mt-1.5">
                    ℹ Admin bisa adjust ke harga final saat lock kalau scope berubah.
                  </div>
                </div>
                <div class="flex justify-end gap-2 pt-1">
                  <button class="btn-ghost" onclick="cancelRakitForm()">Batal</button>
                  <button class="${d.rakitFormDraft.type==='jasa_rakit'?'btn-amber':''}" style="${d.rakitFormDraft.type==='jasa_custom_panel'?'background:#0ea5e9;color:#fff;border-radius:0.75rem;padding:0.55rem 1.1rem;font-weight:800;font-size:12px;border:none;cursor:pointer;':''}" onclick="addRakitToCart()">+ Tambah ke Cart</button>
                </div>
              </div>
              ` : ''}
            </div>

            <!-- Keranjang -->
            ${(d.cartItems.length || d.rakitLines.length) ? `
            <div class="panel-card">
              <div class="flex items-center justify-between mb-3">
                <div class="font-extrabold text-emerald-700 text-[14px] flex items-center gap-2">
                  🧺 Keranjang
                  <span class="bg-emerald-700 text-white px-2 py-0.5 rounded-full text-[11px] font-extrabold">${d.cartItems.length + d.rakitLines.length} item</span>
                </div>
                <div class="font-extrabold text-emerald-700 text-[14px]">${fmtRp(total)}</div>
              </div>

              ${d.cartItems.length ? `
                <div class="label-up mb-2 flex items-center gap-2">
                  <span>📦 Komponen</span>
                  <span class="dotted flex-1"></span>
                </div>
                ${d.cartItems.map((it, idx) => {
                  const stock = CATALOG.find(c => c.sku === it.sku);
                  const atas = stock?.stockAtas ?? 0;
                  const bawah = stock?.stockBawah ?? 0;
                  return `
                  <div class="row-komp p-3 mb-2 grid grid-cols-[1fr_auto_auto_auto_auto] gap-2 items-center text-[12px]">
                    <div>
                      <div class="font-extrabold">${it.name}</div>
                      <div class="text-[11px] text-slate-400 mt-0.5">@ ${fmtRp(it.unitPrice)}</div>
                    </div>
                    <div class="flex gap-0.5 bg-white border border-slate-200 rounded-lg p-0.5">
                      <button onclick="setWarehouse(${idx},'atas')" ${atas===0?'disabled':''} class="px-2 py-1 rounded-md text-[11px] font-extrabold ${it.warehouse==='atas'?'bg-blue-100 text-blue-700':atas===0?'opacity-40 cursor-not-allowed':'text-slate-400 hover:bg-slate-50'}">
                        Atas <span class="text-[10px] opacity-70">${atas}</span>
                      </button>
                      <button onclick="setWarehouse(${idx},'bawah')" ${bawah===0?'disabled':''} class="px-2 py-1 rounded-md text-[11px] font-extrabold ${it.warehouse==='bawah'?'bg-amber-100 text-amber-700':bawah===0?'opacity-40 cursor-not-allowed':'text-slate-400 hover:bg-slate-50'}">
                        Bawah <span class="text-[10px] opacity-70">${bawah}</span>
                      </button>
                    </div>
                    <div class="stepper">
                      <button onclick="updateKompQty(${idx}, -1)">−</button>
                      <input value="${it.qty}" readonly />
                      <button onclick="updateKompQty(${idx}, +1)">+</button>
                    </div>
                    <div class="font-extrabold text-[#012749] min-w-[90px] text-right text-[13px]">${fmtRp(it.qty * it.unitPrice)}</div>
                    <button class="text-slate-300 hover:text-rose-500 text-lg" onclick="removeKomp(${idx})">✕</button>
                  </div>`;
                }).join('')}
              ` : ''}

              ${d.rakitLines.length ? `
                <div class="label-up mb-2 mt-3 flex items-center gap-2">
                  <span style="color:#c2410c">🛠 Jasa Rakit</span>
                  <span class="dotted flex-1"></span>
                </div>
                ${d.rakitLines.map((r, idx) => `
                  <div class="${r.type==='jasa_rakit'?'row-rakit':'row-rakit'} p-3 mb-2 grid grid-cols-[1fr_auto_auto] gap-3 items-center text-[12px]" style="${r.type==='jasa_custom_panel'?'background:linear-gradient(90deg, rgba(14,165,233,0.08), rgba(14,165,233,0.02) 80%); border-left:3px solid #0ea5e9;':''}">
                    <div>
                      <div class="flex items-center gap-2 mb-0.5">
                        <span class="pill ${r.type==='jasa_rakit'?'chip-rakit':'chip-info'}">${r.type==='jasa_rakit'?'⚡ Jasa Rakit':'📦 Jasa Custom Panel'}</span>
                        <span class="font-extrabold text-[13px]">${r.description}</span>
                      </div>
                      <div class="text-[11px] text-slate-500 mt-0.5">Estimasi · final di-adjust admin saat lock</div>
                    </div>
                    <div class="font-extrabold ${r.type==='jasa_rakit'?'text-amber-700':'text-sky-700'} text-[14px]">${fmtRp(r.estimatedPrice)}</div>
                    <button class="text-slate-300 hover:text-rose-500 text-lg" onclick="removeRakit(${idx})">✕</button>
                  </div>
                `).join('')}
              ` : ''}

              ${hasRakit ? `
                <div class="mt-3 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-[11px] text-amber-800">
                  ⚠ <strong>Transaksi ini akan masuk status WIP</strong> karena ada jasa rakit. Lock + approval owner diperlukan sebelum stock decrement &amp; pelunasan.
                </div>
              ` : ''}
            </div>
            ` : `
              <div class="panel-card text-center text-slate-400 text-[13px] py-8 bg-slate-50 border-dashed">
                Belum ada item. Cari komponen atau klik "+ Tambah Jasa Rakit" di atas.
              </div>
            `}
          </div>

          <!-- RIGHT PANEL -->
          <div class="panel-card space-y-4">

            <!-- CUSTOMER -->
            <div>
              <div class="label-up mb-2">Pelanggan</div>

              ${isCustomerLocked ? `
                <!-- Locked state: showing selected customer -->
                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 flex items-center justify-between mb-2">
                  <div class="flex items-center gap-2 text-[12px]">
                    <span>🔒</span>
                    <span class="font-extrabold text-emerald-700">${d.customer}</span>
                    <span class="text-emerald-700/70">(${d.phone})</span>
                  </div>
                  <button class="text-[11px] text-emerald-700 hover:text-emerald-900 font-bold" onclick="unlockCustomer()">✕ Ganti</button>
                </div>
                <div class="opacity-50 pointer-events-none">
                  <div class="space-y-1.5">
                    <input class="field" placeholder="Nama (wajib)" value="${d.customer}" readonly />
                    <input class="field" placeholder="HP (wajib)" value="${d.phone}" readonly />
                    <input class="field" placeholder="Perusahaan (opsional)" value="${d.company}" readonly />
                  </div>
                  <div class="text-[11px] text-slate-400 mt-1.5 pl-1">🔒 Nonaktif — sudah pilih pelanggan terdaftar</div>
                </div>
              ` : `
                <!-- Search bar -->
                <div class="relative mb-2">
                  <input class="field" placeholder="🔎 Cari pelanggan terdaftar (nama / HP)..." value="${d.customerSearchTerm}" oninput="searchCustomer(this.value)" onfocus="state.draft.customerDropdownOpen=true; render();" />
                  ${d.customerDropdownOpen && matches.length > 0 ? `
                    <div class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-48 overflow-y-auto z-20">
                      ${matches.map(c => `
                        <button class="w-full text-left px-3 py-2 hover:bg-slate-50 border-b border-slate-100 last:border-b-0 text-[12px]" onclick="selectCustomer('${c.id}')">
                          <div class="font-bold">${c.name}</div>
                          <div class="text-[11px] text-slate-500">${c.phone}${c.company ? ' · '+c.company : ''}</div>
                        </button>
                      `).join('')}
                    </div>
                  ` : ''}
                  ${d.customerSearchTerm && matches.length === 0 ? `
                    <div class="absolute top-full left-0 right-0 mt-1 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-[11px] text-amber-800 z-20">
                      Tidak ditemukan. Isi sebagai pelanggan baru di bawah ↓
                    </div>
                  ` : ''}
                </div>

                <!-- New customer block -->
                <div class="space-y-1.5">
                  <input class="field" placeholder="Nama (wajib)" value="${d.customer}" oninput="state.draft.customer=this.value" />
                  <input class="field" placeholder="HP (wajib)" value="${d.phone}" oninput="state.draft.phone=this.value" />
                  <input class="field" placeholder="Perusahaan (opsional)" value="${d.company}" oninput="state.draft.company=this.value" />
                </div>
                <div class="text-[11px] text-slate-500 mt-1.5 pl-1">💡 Pelanggan baru akan auto-create setelah simpan</div>
              `}
            </div>

            <!-- PAYMENT METHOD -->
            <div>
              <div class="label-up mb-2">Metode Pembayaran</div>
              <div class="seg">
                <button class="${d.paymentMethod==='cash'?'active':''}" onclick="setPaymentMethod('cash')">💵 Cash</button>
                <button class="${d.paymentMethod==='transfer'?'active':''}" onclick="setPaymentMethod('transfer')">🏦 Transfer</button>
                <button class="${d.paymentMethod==='edc'?'active':''}" onclick="setPaymentMethod('edc')">💳 EDC</button>
              </div>
              ${d.paymentMethod === 'edc' ? `
                <div class="mt-2 fade-in">
                  <div class="key-up mb-1.5">Tipe EDC <span class="text-rose-500">*</span></div>
                  <div class="seg">
                    <button class="${d.paymentSubtype==='debit'?'active':''}" onclick="state.draft.paymentSubtype='debit';render()">💳 Debit</button>
                    <button class="${d.paymentSubtype==='qris'?'active':''}" onclick="state.draft.paymentSubtype='qris';render()">📱 QRIS</button>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- PAYMENT TYPE -->
            <div>
              <div class="label-up mb-2">Tipe Pembayaran</div>
              <div class="seg">
                <button class="${d.paymentType==='FULL'?'active':''}" onclick="state.draft.paymentType='FULL';state.draft.dpAmount=0;render()">Full Payment</button>
                <button class="${d.paymentType==='DP'?'active':''}" onclick="state.draft.paymentType='DP';render()">DP / Tanda Jadi</button>
              </div>
              ${d.paymentType==='DP' ? `
                <div class="grid grid-cols-2 gap-2 mt-2 fade-in">
                  <input class="field" type="number" placeholder="${d.dpInputType==='PERCENT'?'Persen (mis. 30)':'Jumlah DP (Rp)'}" value="${d.dpAmount || ''}" min="0" max="${d.dpInputType==='PERCENT'?100:''}" oninput="state.draft.dpAmount=Number(this.value||0);render()" />
                  <select class="field" onchange="state.draft.dpInputType=this.value;render()">
                    <option value="AMOUNT" ${d.dpInputType==='AMOUNT'?'selected':''}>Nominal (Rp)</option>
                    <option value="PERCENT" ${d.dpInputType==='PERCENT'?'selected':''}>Persen (%)</option>
                  </select>
                </div>
                ${d.dpInputType==='PERCENT' && d.dpAmount > 0 ? `
                  <p class="text-[11px] mt-1 pl-1 font-semibold text-emerald-700">
                    💡 Customer bayar DP: <strong>${fmtRp(effectiveDp)}</strong>${d.dpAmount > 0 && d.dpAmount <= 100 ? ` (${d.dpAmount}% dari ${fmtRp(total)})` : ''}
                    ${d.dpAmount > 100 ? '<span class="text-rose-600"> · ⚠️ Persen tidak boleh > 100</span>' : ''}
                  </p>
                ` : ''}
              ` : ''}
            </div>

            <!-- ONGKIR -->
            <div>
              <div class="label-up mb-2">Tambahan</div>
              <button type="button" onclick="state.draft.ongkirOn=!state.draft.ongkirOn;render()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-[13px] border ${d.ongkirOn?'bg-orange-50 border-orange-500':'bg-slate-50 border-dashed border-slate-300'}">
                <span class="font-extrabold flex items-center gap-1.5 ${d.ongkirOn?'text-orange-700':'text-slate-700'}">
                  🚚 Biaya Ongkir <span class="text-[11px] text-slate-400 font-semibold">(opsional)</span>
                </span>
                <span class="w-8 h-4 rounded-full relative ${d.ongkirOn?'bg-orange-500':'bg-slate-300'}">
                  <span class="absolute top-0.5 w-3 h-3 rounded-full bg-white transition-all ${d.ongkirOn?'left-4':'left-0.5'}"></span>
                </span>
              </button>
              ${d.ongkirOn ? `
                <input class="mt-2 w-full bg-white border border-orange-500 rounded-lg px-3 py-2 text-[13px] font-bold text-orange-700 fade-in" type="number" placeholder="Rp 0" value="${d.ongkirAmount || ''}" oninput="state.draft.ongkirAmount=Number(this.value||0);render()" />
              ` : ''}
            </div>

            <!-- DELIVERY ADDRESS -->
            <div>
              <div class="bg-violet-50 border border-violet-200 rounded-xl px-3 py-2.5">
                <div class="flex justify-between items-center mb-1">
                  <span class="font-extrabold text-violet-700 text-[13px] flex items-center gap-1">📍 Alamat Pengiriman</span>
                  <span class="text-[10px] text-violet-700 font-extrabold uppercase tracking-widest">opsional · tampil di invoice</span>
                </div>
                <textarea class="w-full min-h-[48px] bg-white border border-violet-200 rounded-lg px-3 py-2 text-[13px] text-violet-900 resize-y outline-none" placeholder="Isi jika barang dikirim. Mis. Jl. Merdeka No. 12, Jakarta Utara." oninput="state.draft.deliveryAddress=this.value">${d.deliveryAddress}</textarea>
              </div>
            </div>

            <!-- NOTES -->
            <div>
              <div class="bg-sky-50 border border-sky-200 rounded-xl px-3 py-2.5">
                <div class="flex justify-between items-center mb-1">
                  <span class="font-extrabold text-sky-700 text-[13px] flex items-center gap-1">📝 Catatan</span>
                  <span class="text-[10px] text-sky-700 font-extrabold uppercase tracking-widest">opsional · tampil di invoice</span>
                </div>
                <textarea class="w-full min-h-[56px] bg-white border border-sky-200 rounded-lg px-3 py-2 text-[13px] text-sky-900 resize-y outline-none" placeholder="Mis. Garansi 1 bulan. Bawakan kunci pas." oninput="state.draft.notes=this.value">${d.notes}</textarea>
              </div>
            </div>

            <!-- TOTALS -->
            <div class="bg-slate-50 rounded-xl px-3 py-3">
              <div class="flex justify-between py-1 text-[13px] text-slate-600">
                <span>Subtotal barang</span><span>${fmtRp(subtotalKomp + subtotalRakit)}</span>
              </div>
              ${subtotalKomp ? `<div class="flex justify-between py-0.5 text-[11px] text-slate-500 pl-3">
                <span>· komponen</span><span>${fmtRp(subtotalKomp)}</span>
              </div>` : ''}
              ${subtotalRakit ? `<div class="flex justify-between py-0.5 text-[11px] text-amber-700 font-bold pl-3">
                <span>· jasa rakit</span><span>${fmtRp(subtotalRakit)}</span>
              </div>` : ''}
              ${d.ongkirOn && d.ongkirAmount > 0 ? `<div class="flex justify-between py-1 text-[13px] text-orange-700 font-bold">
                <span>↳ Biaya ongkir</span><span>${fmtRp(d.ongkirAmount)}</span>
              </div>` : ''}
              ${d.paymentType==='DP' && effectiveDp > 0 ? `
                <div class="flex justify-between py-1 text-[13px] text-emerald-700 font-bold">

            <button class="${hasRakit||d.paymentType==='DP'?'btn-amber':'btn-primary'} w-full py-3 text-[14px]" onclick="saveTransaction()" ${(!d.cartItems.length && !d.rakitLines.length) ? 'disabled':''}>

}

function updateKompQty(idx, delta) {

}
function removeKomp(idx) { state.draft.cartItems.splice(idx, 1); render(); }

function saveTransaction() {
  const d = state.draft;
  if (!d.cartItems.length && !d.rakitLines.length) { toast('Cart kosong.', 'warning'); return; }
  if (!d.customer.trim()) { toast('Nama pelanggan wajib diisi.', 'warning'); return; }
  if (!d.phone.trim()) { toast('Nomor HP wajib diisi.', 'warning'); return; }
  if (d.channel === 'tokopedia' && !d.tokpedOrderNo.trim()) { toast('No. Pesanan Tokopedia wajib diisi.', 'warning'); return; }
  if (d.paymentMethod === 'edc' && !d.paymentSubtype) { toast('Pilih sub-tipe EDC (Debit / QRIS).', 'warning'); return; }
  if (d.paymentType === 'DP' && d.dpInputType === 'PERCENT' && (d.dpAmount <= 0 || d.dpAmount > 100)) { toast('Persen DP harus 1-100.', 'warning'); return; }

  const subtotalKomp = d.cartItems.reduce((s,i) => s + (i.qty * i.unitPrice), 0);
  const subtotalRakit = d.rakitLines.reduce((s,r) => s + r.estimatedPrice, 0);
  const total = subtotalKomp + subtotalRakit + (d.ongkirOn ? d.ongkirAmount : 0);
  const effectiveDp = d.paymentType === 'DP'
    ? (d.dpInputType === 'PERCENT' ? Math.round(total * d.dpAmount / 100) : d.dpAmount)
    : 0;
  if (d.paymentType === 'DP' && (effectiveDp <= 0 || effectiveDp >= total)) { toast('Jumlah DP harus > 0 dan < total.', 'warning'); return; }
  const hasRakit = d.rakitLines.length > 0;

  const tx = {
    id: nextInvoiceNo(),
    customer: d.customer, phone: d.phone, company: d.company,
    status: hasRakit ? 'WIP' : (d.paymentType==='DP' ? 'AWAITING_LUNAS' : 'PAID'),
    createdAt: new Date().toISOString().slice(0,16).replace('T',' '),
    cartItems: JSON.parse(JSON.stringify(d.cartItems)),
    rakitLines: JSON.parse(JSON.stringify(d.rakitLines)),
    paymentMethod: d.paymentMethod,
    paymentSubtype: d.paymentSubtype,
    paymentType: d.paymentType,
    dpAmount: effectiveDp,
    dpInputType: d.paymentType==='DP' ? d.dpInputType : null,
    ongkirAmount: d.ongkirOn ? d.ongkirAmount : 0,
    deliveryAddress: d.deliveryAddress.trim() || null,
    notes: d.notes.trim() || null,
    total,
  };
  if (!d.selectedCustomerId) {
    toast(`💡 Pelanggan baru <strong>${d.customer}</strong> akan auto-create.`, 'info');
  }
  state.transactions.push(tx);
  // reset draft
  state.draft = {
    selectedCustomerId: null,
    customer:'', phone:'', company:'',
    customerSearchTerm:'', customerDropdownOpen:false,
    paymentMethod:'cash', paymentSubtype:null, paymentType:'DP', dpAmount:0, dpInputType:'AMOUNT',
    ongkirOn:false, ongkirAmount:0,
    deliveryAddress:'', notes:'',
    channel:'walkin', tokpedOrderNo:'', waPhone:'', waChatUrl:'',
    itemSearchTerm:'',
    cartItems:[], rakitLines:[],
    rakitFormOpen:false, rakitFormDraft:{type:'jasa_rakit',description:'',estimatedPrice:0},
  };

  toast(`✅ Transaksi <strong>${tx.id}</strong> disimpan. Status: <strong>${tx.status}</strong>.`, 'success');
  if (hasRakit) {
    advanceDemo(4);
    setView('wip-list');
  } else {
    setView('cart');
  }
}

// ========================================================
//            LOCK MODAL (admin/kasir submit)
// ========================================================
function openLockModal(txId) {
  const tx = state.transactions.find(t => t.id === txId);
  if (!tx) return;
  state.modal = 'lock';
  state.modalTxId = txId;
  // Init draft from existing tx (deep copy)
  state.lockDraft = JSON.parse(JSON.stringify(tx));
  // Set final price = estimated (default); init mode to 'detail'
  state.lockDraft.rakitLines.forEach(r => {
    if (!r.finalPrice) r.finalPrice = r.estimatedPrice;
    if (!r.trackingMode) r.trackingMode = 'detail'; // 'detail' | 'lumpsum'
    if (r.lumpSumHpp == null) r.lumpSumHpp = 0;
  });
  advanceDemo(5);
  renderModals();
}
function lockSetMode(rakitIdx, mode) {
  state.lockDraft.rakitLines[rakitIdx].trackingMode = mode;
  renderModals();
}
function lockSetLumpHpp(rakitIdx, val) {
  state.lockDraft.rakitLines[rakitIdx].lumpSumHpp = Number(val) || 0;
  renderModals();
}

function lockFieldUpdate(rakitIdx, field, val) {
  state.lockDraft.rakitLines[rakitIdx][field] = val;
  renderModals();
}
function lockAddComponent(rakitIdx, sku) {
  const cat = CATALOG.find(c => c.sku === sku);
  if (!cat) return;
  const r = state.lockDraft.rakitLines[rakitIdx];
  const existing = r.components.find(c => c.sku === sku);
  if (existing) { existing.qty += 1; existing.fifoCost = existing.qty * cat.fifoCost; }
  else { r.components.push({ sku, name:cat.name, qty:1, fifoCost: cat.fifoCost }); }
  renderModals();
}
function lockComponentQty(rakitIdx, cIdx, delta) {
  const r = state.lockDraft.rakitLines[rakitIdx];
  const c = r.components[cIdx];
  const cat = CATALOG.find(x => x.sku === c.sku);
  c.qty = Math.max(1, c.qty + delta);
  c.fifoCost = c.qty * (cat ? cat.fifoCost : (c.fifoCost / Math.max(1, c.qty - delta)));
  renderModals();
}
function lockRemoveComponent(rakitIdx, cIdx) {
  state.lockDraft.rakitLines[rakitIdx].components.splice(cIdx, 1);
  renderModals();
}

function submitLock() {
  const tx = state.transactions.find(t => t.id === state.modalTxId);
  if (!tx) return;
  // Copy lockDraft → tx
  tx.rakitLines = state.lockDraft.rakitLines;
  tx.status = 'PENDING_LOCK_APPROVAL';
  tx.submittedAt = new Date().toISOString().slice(0,16).replace('T',' ');
  tx.submittedBy = state.isOwner ? 'Owner Pak Tony' : 'Admin Toko';
  state.modal = null;
  state.modalTxId = null;
  state.lockDraft = null;
  toast(`📤 <strong>${tx.id}</strong> submitted for approval. Status: <strong>PENDING_LOCK_APPROVAL</strong>.`, 'info');
  advanceDemo(6);
  setView('wip-list');
}

function closeModal() {
  state.modal = null;
  state.modalTxId = null;
  state.lockDraft = null;
  state.reviewDraft = null;
  state.cancelDraft = null;
  state.rejectDraft = null;
  renderModals();
}

// ========================================================
//          APPROVAL REVIEW MODAL
// ========================================================
function openReviewModal(txId) {
  if (!state.isOwner) {
    toast('⚠ Approval cuma bisa dilakukan oleh <strong>Owner</strong>. Switch role dulu.', 'warning');
    return;
  }
  const tx = state.transactions.find(t => t.id === txId);
  if (!tx) return;
  state.modal = 'review';
  state.modalTxId = txId;
  state.reviewDraft = JSON.parse(JSON.stringify(tx));
  advanceDemo(7);
  renderModals();
}
function reviewSetHppOverride(rakitIdx, val) {
  state.reviewDraft.rakitLines[rakitIdx].hppOverride = val;
  renderModals();
}
function approveTransaction() {
  const tx = state.transactions.find(t => t.id === state.modalTxId);
  if (!tx) return;
  // Apply HPP override if any
  tx.rakitLines = state.reviewDraft.rakitLines;
  // Decide next state: if sisa > 0 → AWAITING_LUNAS, else PAID
  const sisa = tx.total - tx.dpAmount;
  tx.status = sisa > 0 ? 'AWAITING_LUNAS' : 'PAID';
  tx.approvedAt = new Date().toISOString().slice(0,16).replace('T',' ');
  tx.approvedBy = 'Owner Pak Tony';
  const detailLines = tx.rakitLines.filter(r => (r.trackingMode||'detail') === 'detail');
  const compCount = detailLines.reduce((s,r)=>s+r.components.length,0);
  const lumpsumCount = tx.rakitLines.length - detailLines.length;
  const adjustmentMsg = compCount > 0
    ? `Stock Adjustment dibuat untuk ${compCount} komponen (detail mode).`
    : '';
  const lumpsumMsg = lumpsumCount > 0
    ? `${lumpsumCount} rakit line dalam lump-sum mode — stock tidak otomatis decrement.`
    : '';
  toast(`✅ <strong>${tx.id}</strong> approved! ${adjustmentMsg} ${lumpsumMsg} Status → <strong>${tx.status}</strong>.`, 'success');
  closeModal();
  advanceDemo(8);
  render();
}
function openRejectModal() {
  state.modal = 'reject';
  state.rejectDraft = { reason: '' };
  renderModals();
}
function submitReject() {
  if (!state.rejectDraft.reason.trim()) { toast('Alasan reject wajib diisi.', 'warning'); return; }
  const tx = state.transactions.find(t => t.id === state.modalTxId);
  if (!tx) return;
  tx.status = 'WIP';
  tx.rejectedReason = state.rejectDraft.reason;
  toast(`❌ <strong>${tx.id}</strong> rejected. Status → <strong>WIP</strong>. Admin notified to fix &amp; resubmit.`, 'warning');
  closeModal();
  render();
}

// ========================================================
//          CANCEL MODAL
// ========================================================
function openCancelModal(txId) {
  const tx = state.transactions.find(t => t.id === txId);
  if (!tx) return;
  state.modal = 'cancel';
  state.modalTxId = txId;
  state.cancelDraft = { refund: 0, reason: '' };
  renderModals();
}
function cancelSetRefund(val) {
  state.cancelDraft.refund = Number(val) || 0;
  renderModals();
}
function submitCancel() {
  const tx = state.transactions.find(t => t.id === state.modalTxId);
  if (!tx) return;
  const c = state.cancelDraft;
  if (c.refund < 0 || c.refund > tx.dpAmount) { toast(`Refund harus antara 0 dan ${fmtRp(tx.dpAmount)}.`, 'warning'); return; }
  if (!c.reason.trim()) { toast('Alasan cancel wajib diisi.', 'warning'); return; }
  tx.status = 'CANCELLED';
  tx.cancelRefund = c.refund;
  tx.cancelForfeit = tx.dpAmount - c.refund;
  tx.cancelReason = c.reason;
  toast(`❌ <strong>${tx.id}</strong> cancelled. Refund: ${fmtRp(c.refund)}, Forfeit: ${fmtRp(tx.cancelForfeit)}.`, 'warning');
  closeModal();
  render();
}

// ========================================================
//                  RENDER: MODALS
// ========================================================
function renderModals() {
  if (!state.modal) {
    $('#modals').innerHTML = '';
    return;
  }
  if (state.modal === 'lock') renderLockModal();
  else if (state.modal === 'review') renderReviewModal();
  else if (state.modal === 'reject') renderRejectModal();
  else if (state.modal === 'cancel') renderCancelModal();
}

function renderLockModal() {
  const tx = state.lockDraft;
  if (!tx) return;
  const linesHtml = tx.rakitLines.map((r, ri) => {
    const isDetail = r.trackingMode === 'detail';
    const hppKomp = r.components.reduce((s,c)=>s+c.fifoCost, 0);
    const hppTotal = isDetail ? (hppKomp + (r.laborCost || 0)) : (r.lumpSumHpp || 0);
    const margin = (r.finalPrice||0) - hppTotal;
    const marginPct = r.finalPrice ? (margin/r.finalPrice*100) : 0;
    return `
    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 ${ri>0?'mt-3':''}">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="pill ${r.type==='jasa_rakit'?'chip-rakit':'chip-info'}">${r.type==='jasa_rakit'?'⚡ Jasa Rakit':'📦 Jasa Custom Panel'}</span>
          <span class="font-extrabold text-[14px]">${r.description}</span>
        </div>
        <div class="text-[11px] text-slate-500">Line ${ri+1} dari ${tx.rakitLines.length}</div>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-4">
