steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '--build-arg'
      - 'VITE_BACKEND_URL=$_VITE_BACKEND_URL'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=$_VITE_SUPABASE_URL'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=$_VITE_SUPABASE_ANON_KEY'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE_NAME'
      - '--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=$_PLATFORM'
      - '--allow-unauthenticated'
      # Deploy new revisions at 0% traffic, addressable via a per-commit tag URL:
      #   https://preview-<SHORT_SHA>---<service>.run.app
      # Smoke-test the tag URL, then promote with:
      #   gcloud run services update-traffic $_SERVICE_NAME \
      #     --region=$_DEPLOY_REGION --to-revisions=<rev>=100
      # Root cause from 2026-06-16 Produk & Stok regression: deploys without
      # --no-traffic auto-shifted traffic to revisions built from main HEAD
      # before all feature branches were merged. See progress.md post-mortem.
      - '--no-traffic'
      - '--tag=preview-$SHORT_SHA'

images:
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'

substitutions:
  _VITE_BACKEND_URL: https://garindo-jaya-panel-msme-erp-422860632808.asia-southeast1.run.app

options:
  logging: CLOUD_LOGGING_ONLY
