steps:
  # ── Step 0: Download CLIP model ────────────────────────────────────────────
  # Dockerfile Step 15/17 expects it at models/clip-vit-base-patch32.onnx
  # via repo-root build context. Without this, backend build fails at COPY.
  # Build trigger has been failing since ~2026-06-18 (post foto-search commit
  # 5a2d9b8) until this step was added.
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args: ['scripts/download-clip-model.sh']

  # ── Step 1: Build image ────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '-f'
      - 'backend-go/Dockerfile'
      - '.'

  # ── Step 2: Push image ─────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'

  # ── Step 3: Deploy to STAGING backend ─────────────────────────────────────
  # Staging is scaled-to-zero — no real users. Deploy at 100% traffic directly.
  # Same image SHA validates here, then promotes to prod if smoke passes.
  # SUPABASE_SERVICE_KEY sourced from GCP Secret Manager (Sub D — see progress.md).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - 'garindo-jaya-panel-msme-erp-staging'
      - '--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=$_PLATFORM'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=60s'
      - '--update-env-vars=SUPABASE_URL=$_SUPABASE_URL,SUPABASE_PROJECT_REF=$_SUPABASE_PROJECT_REF,GEMINI_API_KEY=$_GEMINI_API_KEY,DEBOUNCE_ENABLED=$_DEBOUNCE_ENABLED,DEBOUNCE_SOFT_WAIT_MS=$_DEBOUNCE_SOFT_WAIT_MS,DEBOUNCE_HARD_WAIT_MS=$_DEBOUNCE_HARD_WAIT_MS,API_VERSION=v1,OPENROUTER_API_KEY=$_OPENROUTER_API_KEY,LLM_BACKEND=$_LLM_BACKEND,ENABLE_OPENROUTER=$_ENABLE_OPENROUTER,SENTRY_DSN=$_SENTRY_DSN_BE,ENVIRONMENT=staging,COMMIT_SHA=$COMMIT_SHA'
      - '--update-secrets=SUPABASE_SERVICE_KEY=supabase-service-key-prod:latest,SUPABASE_DB_CONNECTION=supabase-db-connection-prod:latest,SUPABASE_DB_LISTENER_CONNECTION=supabase-db-connection-listener-prod:latest,RESEND_API_KEY=RESEND_API_KEY:latest,CALEO_OPS_EMAIL=CALEO_OPS_EMAIL:latest'
      # failureThreshold=60 @ periodSeconds=5 = 300s (5 min) max startup window.
      # 2026-07-22: bumped from 12 → 60 to survive Supabase :5432 pool cool-down
      # after repeated BE deploy failures. NewClient's inner retry loop pings
      # every 10s; 5 min allows ~30 attempts before Cloud Run gives up.
      - '--startup-probe=httpGet.path=/api/v1/ready,initialDelaySeconds=5,periodSeconds=5,failureThreshold=60'
      - '--liveness-probe=httpGet.path=/api/v1/live,periodSeconds=30,failureThreshold=3'

  # ── Step 4: Staging BE smoke test ─────────────────────────────────────────
  # Minimal BE health checks before promoting to prod.
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        STAGING_BE_URL="https://garindo-jaya-panel-msme-erp-staging-422860632808.asia-southeast1.run.app"

        echo "=== Staging BE smoke tests ==="

        # Wait for staging to be ready (scaled-to-zero cold start may take ~10s)
        for i in 1 2 3 4 5 6; do
          HTTP=$(curl -sfo /dev/null -w "%{http_code}" "$$STAGING_BE_URL/api/v1/live" || echo "000")
          [ "$$HTTP" = "200" ] && { echo "BE /live: 200 OK"; break; }
          [ "$$i" -eq 6 ] && { echo "BE /live: $$HTTP after 6 attempts"; exit 1; }
          echo "Attempt $$i: $$HTTP — retrying in 10s"; sleep 10
        done

        # DB connectivity
        HTTP=$(curl -sfo /dev/null -w "%{http_code}" "$$STAGING_BE_URL/api/v1/ready" || echo "000")
        [ "$$HTTP" = "200" ] || { echo "BE /ready: $$HTTP — DB unreachable on staging"; exit 1; }
        echo "BE /ready: 200 OK"

        echo "=== All staging BE smoke tests passed ==="

  # ── Step 5: Deploy to PROD backend ────────────────────────────────────────
  # Deploy the SAME image SHA that passed staging smoke.
  # Added 0%-traffic + tag-URL pattern (mirrors frontend safety net from
  # 2026-06-16 post-mortem). Tag URL: https://c<SHORT_SHA>---<service>.run.app
  # Service name 'garindo-jaya-panel-msme-erp' is 28 chars, so tag ≤18 chars.
  # 'c$SHORT_SHA' is 8 chars — well within limit.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE_NAME'
      - '--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=$_PLATFORM'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=60s'
      - '--update-env-vars=SUPABASE_URL=$_SUPABASE_URL,SUPABASE_PROJECT_REF=$_SUPABASE_PROJECT_REF,GEMINI_API_KEY=$_GEMINI_API_KEY,DEBOUNCE_ENABLED=$_DEBOUNCE_ENABLED,DEBOUNCE_SOFT_WAIT_MS=$_DEBOUNCE_SOFT_WAIT_MS,DEBOUNCE_HARD_WAIT_MS=$_DEBOUNCE_HARD_WAIT_MS,API_VERSION=v1,OPENROUTER_API_KEY=$_OPENROUTER_API_KEY,LLM_BACKEND=$_LLM_BACKEND,ENABLE_OPENROUTER=$_ENABLE_OPENROUTER,SENTRY_DSN=$_SENTRY_DSN_BE,ENVIRONMENT=production,COMMIT_SHA=$COMMIT_SHA'
      - '--update-secrets=SUPABASE_SERVICE_KEY=supabase-service-key-prod:latest,SUPABASE_DB_CONNECTION=supabase-db-connection-prod:latest,SUPABASE_DB_LISTENER_CONNECTION=supabase-db-connection-listener-prod:latest,RESEND_API_KEY=RESEND_API_KEY:latest,CALEO_OPS_EMAIL=CALEO_OPS_EMAIL:latest'
      # Health probe split (slot 315 / Task 9):
      # /api/v1/live  — liveness (process alive, no deps) — periodic restart guard.
      # /api/v1/ready — readiness (DB ping) — stops traffic if Postgres unreachable.
      # Startup probe uses /ready so Cloud Run waits for DB before routing traffic.
      # failureThreshold=12 @ periodSeconds=5 = 60s max startup window.
      # failureThreshold=60 @ periodSeconds=5 = 300s (5 min) max startup window.
      # 2026-07-22: bumped from 12 → 60 to survive Supabase :5432 pool cool-down
      # after repeated BE deploy failures. NewClient's inner retry loop pings
      # every 10s; 5 min allows ~30 attempts before Cloud Run gives up.
      - '--startup-probe=httpGet.path=/api/v1/ready,initialDelaySeconds=5,periodSeconds=5,failureThreshold=60'
      - '--liveness-probe=httpGet.path=/api/v1/live,periodSeconds=30,failureThreshold=3'
      - '--no-traffic'
      - '--tag=c$SHORT_SHA'

  # ── AUTO-PROMOTE REMOVED 2026-07-22 ─────────────────────────────────────────
  # Real tenant onboarded — every prod deploy MUST require manual approval.
  # Prod tag revision deployed at 0% traffic by Step 5. Founder promotes
  # manually via `./scripts/promote-to-prod.sh <SHORT_SHA>`.
  # Do NOT add auto-promote step back without founder approval.
  # See docs/runbooks/deploy-promote.md + memory
  # feedback_manual_prod_gate_after_real_tenant.

images:
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _DEBOUNCE_ENABLED: 'false'
  _DEBOUNCE_SOFT_WAIT_MS: '5000'
  _DEBOUNCE_HARD_WAIT_MS: '12000'
  _SUPABASE_URL: 'https://ekhhojaezdfjfwuxyjkl.supabase.co'
  _SUPABASE_PROJECT_REF: 'ekhhojaezdfjfwuxyjkl'
  _LLM_BACKEND: 'gemini'
  _ENABLE_OPENROUTER: 'true'
  # Sentry: empty default so build works without Sentry credentials.
  # Set at trigger level once Sentry account is created.
  _SENTRY_DSN_BE: ''
  # _OPENROUTER_API_KEY + _GEMINI_API_KEY: set at trigger level.
  # SUPABASE_SERVICE_KEY: moved to GCP Secret Manager (supabase-service-key-prod:latest).
  # SUPABASE_DB_CONNECTION: moved to GCP Secret Manager (supabase-db-connection-prod:latest)
  #   — 2026-07-17 security fix, plaintext password was exposed in Cloud Run env.
  #   Follow-up: remove _SUPABASE_DB_CONN from trigger substitutions after confirming deploy.
  # Remove _SUPABASE_SERVICE_KEY from trigger substitutions after confirming deploy.
